<div class="modal-header" style="padding: 0.4rem 1rem;" appDraggable>
    <h5 class="modal-title" id="modal-basic-title">{{title}}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modalInstance.dismiss('Cross click')"></button>
</div>

<div class="modal-body entity-body" [class.has-description]="description">
    @if (description) {
      <div class="effect-description">{{description}}</div>
    } @else {
      <iframe #entityFrame [src]="url|safe: 'resourceUrl'" width="100%" height="100%" [title]="title" (load)="frameLoaded(entityFrame)"></iframe>
    }

    @if (referencePopupUrl) {
      <section class="reference-popup" aria-label="Rule reference">
        <header>
          <strong>{{referencePopupTitle}}</strong>
          <button type="button" class="btn-close" aria-label="Close reference" (click)="closeReferencePopup()"></button>
        </header>
        <iframe #referenceFrame [src]="referencePopupUrl|safe: 'resourceUrl'" width="100%" height="100%" [title]="referencePopupTitle" (load)="frameLoaded(referenceFrame)"></iframe>
      </section>
    }
</div>
